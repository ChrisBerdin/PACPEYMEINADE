  .pop a { color:#1b4fa8; font-size:.88rem; margin-right:10px; }

  map.addLayer({ id:'commune-bord', type:'line', source:'commune', paint:{ 'line-color':'#4a4ad0', 'line-width':2 } });
  map.addSource('commerces', { type: 'geojson', data: COMMERCES });
  map.addLayer({ id:'pastilles-halo', type:'circle', source:'commerces',
    paint:{ 'circle-radius':['interpolate',['linear'],['zoom'],2,3,14,8,18,14], 'circle-color':'#fff', 'circle-opacity':0.95 } });
  map.addLayer({ id:'pastilles', type:'circle', source:'commerces',
    paint:{ 'circle-radius':['interpolate',['linear'],['zoom'],2,2,14,5.5,18,10], 'circle-color':['get','couleur'] } });
  map.on('click', 'pastilles', function (e) {
    var nom = e.features[0].properties.nom;
    var f = COMMERCES.features.filter(function (x) { return x.properties.nom === nom; })[0];
    if (f) ouvrirFiche(f);
  });
  var infobulle = new maplibregl.Popup({ closeButton:false, closeOnClick:false, offset:12, className:'survol' });
  map.on('mousemove', 'pastilles', function (e) {
    map.getCanvas().style.cursor = 'pointer';
    infobulle.setLngLat(e.features[0].geometry.coordinates.slice()).setText(e.features[0].properties.nom).addTo(map);
  });
  map.on('mouseleave', 'pastilles', function () { map.getCanvas().style.cursor = ''; infobulle.remove(); });
  map.setLight({ anchor:'viewport', color:'#fff1d0', intensity:0.5, position:[1.3, 210, 40] });
  chargerBatimentsIGN();
  rafraichir();
  setTimeout(allerAPeymeinade, 1500);
});

// Bâtiments détaillés : BD TOPO (IGN) = hauteur mesurée + usage de chaque bâtiment.
// Si le service IGN ne répond pas, les bâtiments OpenFreeMap restent affichés.
function chargerBatimentsIGN() {
  var xs = [], ys = [];
  CONTOUR.geometry.coordinates[0].forEach(function (c) { xs.push(c[0]); ys.push(c[1]); });
  var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs), y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
  var url = 'https://data.geopf.fr/wfs/ows?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetFeature&TYPENAMES=BDTOPO_V3:batiment'
    + '&OUTPUTFORMAT=application/json&SRSNAME=EPSG:4326&COUNT=9000&BBOX=' + [y0, x0, y1, x1].join(',') + ',EPSG:4326';
  function aplatir(c, swap) {
    if (typeof c[0] === 'number') return swap ? [c[1], c[0]] : [c[0], c[1]];
    return c.map(function (d) { return aplatir(d, swap); });
  }
  fetch(url).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (g) {
    if (!g.features || !g.features.length) throw new Error('vide');
    var p = g.features[0].geometry.coordinates, k = p; while (typeof k[0] !== 'number') k = k[0];
    var swap = k[0] > 30;   // lat/lon inversés → on remet lon/lat
    g.features.forEach(function (f) { f.geometry.coordinates = aplatir(f.geometry.coordinates, swap); });
    map.addSource('bdtopo', { type: 'geojson', data: g });
    map.addLayer({ id:'batiments-ign', type:'fill-extrusion', source:'bdtopo', minzoom:14, paint:{
      'fill-extrusion-color':['match',['get','usage_1'],
        'Résidentiel','#e8dcc0','Commercial et services','#e9b44c','Industriel','#a9a9b4','Agricole','#b9c79a',
        'Religieux','#c98b8b','Sportif','#8ec5a0','Annexe','#d6cfbd','#e2d3ae'],
      'fill-extrusion-height':['interpolate',['linear'],['zoom'],14,0,15.5,['coalesce',['get','hauteur'],5]],
      'fill-extrusion-base':0,
      'fill-extrusion-opacity':0.92,
      'fill-extrusion-vertical-gradient':true } }, 'commune-fond');
    map.setLayoutProperty('batiments-3d', 'visibility', 'none');
  }).catch(function (e) { console.warn('BD TOPO indisponible, bâtiments OpenFreeMap conservés :', e); });
}

function allerAPeymeinade() { map.flyTo({ center: CENTRE, zoom: 16, pitch: 62, bearing: -20, duration: 9000, curve: 1.6, essential: true }); }
document.getElementById('btn-peymeinade').onclick = allerAPeymeinade;
if (window.innerWidth <= 700) fermerPanneau(true);
rafraichir();
</script>
